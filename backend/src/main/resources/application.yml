server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 120m
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
spring:
  application:
    name: achievement-manager
  datasource:
    url: ${DB_URL:jdbc:h2:file:./.data/achievements;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: org.h2.Driver
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 22MB
  jackson:
    time-zone: Asia/Shanghai
mybatis:
  configuration:
    map-underscore-to-camel-case: true
app:
  seed-demo: ${SEED_DEMO:true}
  storage-dir: ${MATERIALS_DIR:./.data/materials}
