services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: achievements
      MYSQL_USER: achievement
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_URL: jdbc:mysql://mysql:3306/achievements?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USERNAME: achievement
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MATERIALS_DIR: /app/.data/materials
      SEED_DEMO: "false"
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?Set INITIAL_ADMIN_PASSWORD in .env}
      SERVER_ADDRESS: 0.0.0.0
      PORT: 8080
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      - materials-data:/app/.data
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
  materials-data:
